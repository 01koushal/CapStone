{% extends "base.html" %}{% block content %}<section class="formwrap"><div class="eyebrow">ASSESSMENT BUILDER</div><h1>Create assessment</h1><p class="muted">Use a skill, subject or any topic. Questions are generated dynamically.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Assessment title<input name="title" placeholder="e.g. Backend Developer Screening" required></label><label>Topic / skill focus<input name="topic" placeholder="e.g. Python, SQL and API design" required></label><div class="two"><label>Number of questions<input type="number" name="question_count" min="1" max="30" value="10"></label><label>Total duration (minutes)<input type="number" name="duration" min="5" max="240" value="30"></label></div><button class="btn">Create and generate invite link</button></form></section>{% endblock %}
