{% extends "base.html" %}{% block content %}<section class="formwrap"><div class="eyebrow">RECRUITER WORKSPACE</div><h1>{{ mode }}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if mode=="Create account" %}<label>Company name<input name="company" required></label><label>Your name<input name="name" required></label>{% endif %}<label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="8" required></label><button class="btn">{{ mode }}</button></form><p class="muted">{% if mode=="Create account" %}Already registered? <a href="{{ url_for('login') }}">Sign in</a>{% else %}New to TalentLens? <a href="{{ url_for('register') }}">Create an account</a>{% endif %}</p></section>{% endblock %}
